[package]
name = "inkwell"
version = "0.2.0"
description = "A fast markdown editor and viewer"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
comrak = { version = "0.59", default-features = false }
ammonia = "4"
trash = "5"
tauri-plugin-single-instance = "2"
serde_json = "1"
# Claude API: HTTPS client and the API key in Windows Credential Manager.
ureq = "3"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2"

# PDF export talks to WebView2 directly; versions must match the ones wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
