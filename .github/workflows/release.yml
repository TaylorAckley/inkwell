name: Release

# Push a tag like v0.2.0 to build and sign the NSIS installer and attach it,
# with latest.json for the updater, to a draft release. Installed copies of
# Inkwell see the update once the draft is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The build runs third-party code (npm and Cargo dependencies), so it only gets a read-only token.
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match tauri.conf.json version $version" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Runs `npm run build` first, then produces the NSIS installer and its
      # update signature (.sig). The key file has no password.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # Only this job can write, and it runs nothing from the repository.
  publish:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a commit because this job holds the write token; Dependabot bumps it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer
          path: installer

      # What the updater reads from releases/latest/download/latest.json.
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(cd installer && ls *.exe)
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "installer/$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$exe" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > installer/latest.json
          cat installer/latest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" installer/*.exe installer/*.exe.sig installer/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Inkwell $TAG" \
            --generate-notes \
            --draft
